<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#4F46E5" />
    <meta
      name="description"
      content="TechCare Solutions: servicio técnico, inventario y facturación"
    />
    <title>TechCare Solutions</title>
    <!-- Aplica el tema guardado (o el de Windows) antes de cargar Vue, para que no parpadee en blanco -->
    <script>
      try {
        var t = localStorage.getItem('umg-theme')
        if (t ? t === 'dark' : matchMedia('(prefers-color-scheme: dark)').matches)
          document.documentElement.classList.add('dark')
      } catch (e) {}
    </script>
    <!-- Color de fondo mientras carga el CSS de la app (mismos valores que tokens.css) -->
    <style>
      html { background: rgb(248 250 252); color-scheme: light; }
      html.dark { background: rgb(11 17 32); color-scheme: dark; }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/app/main.ts"></script>
  </body>
</html>
