<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#4F46E5" />
    <meta
      name="description"
      content="Administración de usuarios, roles y menús de UMG La Florida"
    />
    <title>La Florida · Administración</title>
    <!-- Aplica el tema guardado (o el de Windows) antes de cargar Vue, para que no parpadee en blanco -->
    <script>
      try {
        var t = localStorage.getItem('umg-theme')
        if (t ? t === 'dark' : matchMedia('(prefers-color-scheme: dark)').matches)
          document.documentElement.classList.add('dark')
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/app/main.ts"></script>
  </body>
</html>
